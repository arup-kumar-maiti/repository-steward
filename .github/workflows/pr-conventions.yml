name: PR conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-conventions:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR convention validator
        uses: actions/checkout@v4
        with:
          repository: arup-kumar-maiti/repository-steward
          ref: main
          path: .repository-steward
      - name: Validate PR conventions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .repository-steward/scripts/validate_pull_request.py
